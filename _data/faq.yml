- question: "평일 진료시간은 언제인가요?"
  answer: >-
    월요일부터 금요일까지 오전 9시부터 오후 7시까지이며, 점심시간은 오후 1시부터 2시까지입니다. 임시 휴진이나 진료시간 변경이 있을 수 있어 방문 전 전화 확인을 권합니다.
- question: "토요일에도 진료하나요?"
  answer: >-
    토요일은 오전 9시부터 오후 2시까지 진료합니다. 일정 변경 가능성이 있으므로 방문 전 전화로 확인해 주세요.
- question: "공휴일에도 진료하나요?"
  answer: >-
    공휴일 진료 여부와 시간은 날짜에 따라 달라질 수 있습니다. 방문 전 031-247-7522로 당일 진료 여부를 확인해 주세요. 
- question: "약손한의원은 어디에 있나요?"
  answer: >-
    경기도 수원시 팔달구 세지로 393, 농협 우만지점 2층에 있습니다.
- question: "처음 방문할 때 무엇을 준비하면 좋나요?"
  answer: >-
    가장 불편한 증상이 언제 시작됐는지, 기존에 받은 검사나 진단, 현재 복용 중인 약이 있다면 함께 알려주시면 진료 상담에 도움이 됩니다. 관련 검사 결과나 약 목록이 있으면 가져오셔도 좋습니다.
- question: "약침 치료는 누구나 받을 수 있나요?"
  answer: >-
    약침을 포함한 치료 방법은 현재 증상, 과거력, 복용약 등을 확인한 뒤 의료진이 적합 여부를 판단합니다. 특정 치료를 미리 정하기보다 현재 불편한 증상을 먼저 상담해 주세요.
