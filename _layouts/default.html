<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4d">
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% include jsonld-clinic.html %}
  {% if page.extra_jsonld %}{{ page.extra_jsonld }}{% endif %}
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  {% include header.html %}
  <main id="main">{{ content }}</main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

  <nav class="mobile-bottom-bar" aria-label="약손한의원 빠른 메뉴">
  <a href="https://map.naver.com/p/search/%EC%95%BD%EC%86%90%ED%95%9C%EC%9D%98%EC%9B%90/place/12851356"
     target="_blank"
     rel="noopener">
    <span class="mobile-bar-icon">N</span>
    <span>플레이스</span>
  </a>

  <a href="{{ site.data.clinic.phone_uri }}">
    <span class="mobile-bar-icon">☎</span>
    <span>전화</span>
  </a>

  <a href="{{ site.data.clinic.naver_blog }}"
     target="_blank"
     rel="noopener">
    <span class="mobile-bar-icon">B</span>
    <span>블로그</span>
  </a>

</nav>

  
</body>
</html>
